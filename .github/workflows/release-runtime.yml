name: Runtime Release
run-name: Release ${{ inputs.version }} with sandboxer ${{ inputs.sandboxer_version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Runtime version in runtime-vX.Y.Z form
        required: true
        type: string
      sandboxer_version:
        description: Published sandboxer version embedded as sandbox-init
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: runtime-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate release request
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          SANDBOXER_VERSION: ${{ inputs.sandboxer_version }}
        run: |
          set -euo pipefail
          [ "$GITHUB_REF" = refs/heads/main ] \
            || { echo "Runtime Release must be dispatched from main" >&2; exit 1; }
          [[ "$VERSION" =~ ^runtime-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] \
            || { echo "version must match runtime-vX.Y.Z" >&2; exit 1; }
          [[ "$SANDBOXER_VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] \
            || { echo "sandboxer_version must match vX.Y.Z" >&2; exit 1; }
          bash scripts/publish-release.sh check "$VERSION"

  build:
    needs: preflight
    runs-on:
      - self-hosted
      - Linux
      - X64
      - kuasar-e2e
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      TARGET_ARCH: x86_64
      GOPROXY: https://goproxy.cn,direct
      GOSUMDB: sum.golang.google.cn
      GOTOOLCHAIN: local
      SANDBOXER_VERSION: ${{ inputs.sandboxer_version }}
    steps:
      - name: Create read-only source token
        id: source-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.KUASAR_CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.KUASAR_CI_APP_PRIVATE_KEY }}
          owner: kuasar-sandbox
          repositories: accelerator,connector,guest-runtime,orchestrator,sandboxer
          permission-contents: read
          skip-token-revoke: true

      - name: Verify sandboxer release
        env:
          GH_TOKEN: ${{ steps.source-token.outputs.token }}
        run: |
          set -euo pipefail
          gh api "repos/kuasar-sandbox/sandboxer/releases/tags/$SANDBOXER_VERSION" \
            --jq 'select(.draft == false and .prerelease == false) | .tag_name' \
            | grep -Fx "$SANDBOXER_VERSION" >/dev/null

      - name: Check out exact guest-runtime source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kuasar-sandbox/guest-runtime
          ref: ${{ github.sha }}
          path: src/guest-runtime
          token: ${{ steps.source-token.outputs.token }}
          persist-credentials: false

      - name: Check out accelerator dependency
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kuasar-sandbox/accelerator
          ref: main
          path: src/accelerator
          token: ${{ steps.source-token.outputs.token }}
          persist-credentials: false

      - name: Check out connector dependency
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kuasar-sandbox/connector
          ref: main
          path: src/connector
          token: ${{ steps.source-token.outputs.token }}
          persist-credentials: false

      - name: Check out versioned sandboxer dependency
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kuasar-sandbox/sandboxer
          ref: ${{ inputs.sandboxer_version }}
          path: src/sandboxer
          token: ${{ steps.source-token.outputs.token }}
          persist-credentials: false

      - name: Check out native cache tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kuasar-sandbox/orchestrator
          ref: main
          path: src/orchestrator
          token: ${{ steps.source-token.outputs.token }}
          persist-credentials: false

      - name: Revoke source token before code execution
        if: ${{ always() && steps.source-token.outputs.token != '' }}
        env:
          GH_TOKEN: ${{ steps.source-token.outputs.token }}
        run: |
          curl --fail --show-error --silent \
            --request DELETE \
            --output /dev/null \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/installation/token

      - name: Assemble source workspace and caches
        run: |
          set -euo pipefail
          rm -f go.work go.work.sum
          go work init ./src/accelerator ./src/connector ./src/guest-runtime ./src/sandboxer
          install -d -m 0755 /var/cache/kuasar/tarballs
          mkdir -p src/guest-runtime/native-deps/build src/sandboxer/native-deps/build
          ln -sfn /var/cache/kuasar/tarballs src/guest-runtime/native-deps/build/tarball
          ln -sfn /var/cache/kuasar/tarballs src/sandboxer/native-deps/build/tarball

      - name: Restore or build runtime native inputs
        env:
          KUASAR_WORKSPACE_ROOT: ${{ github.workspace }}/src
        run: src/orchestrator/release-builder/scripts/native-cache.sh restore-or-build erofs envd

      - name: Build and test runtime image
        run: |
          set -euo pipefail
          make -C src/guest-runtime test
          make -C src/guest-runtime vet
          make -C src/sandboxer sandbox-init
          make -C src/guest-runtime flatten-ctl sandbox-runtime

      - name: Package runtime release
        working-directory: src/guest-runtime
        env:
          VERSION: ${{ inputs.version }}
          RELEASE_WORKFLOW_REPOSITORY: ${{ github.repository }}
          RELEASE_WORKFLOW_RUN_ID: ${{ github.run_id }}
          RELEASE_WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
          RELEASE_WORKFLOW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          {
            printf 'repository\trequested_ref\tresolved_sha\trole\n'
            printf 'kuasar-sandbox/accelerator\tmain\t%s\tdependency\n' \
              "$(git -C ../accelerator rev-parse HEAD)"
            printf 'kuasar-sandbox/connector\tmain\t%s\tdependency\n' \
              "$(git -C ../connector rev-parse HEAD)"
            printf 'kuasar-sandbox/guest-runtime\tmain\t%s\tprimary\n' \
              "$(git rev-parse HEAD)"
            printf 'kuasar-sandbox/sandboxer\t%s\t%s\tdependency\n' \
              "$SANDBOXER_VERSION" "$(git -C ../sandboxer rev-parse HEAD)"
          } > revisions.tsv
          [ "$(git rev-parse HEAD)" = "$GITHUB_SHA" ]
          SOURCE_DATE_EPOCH=$(git show -s --format=%ct "$GITHUB_SHA")
          export SOURCE_DATE_EPOCH
          bash scripts/release.sh package runtime "$VERSION" "$TARGET_ARCH" \
            revisions.tsv release-bundle

      - name: Upload validated runtime bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime-release-${{ inputs.version }}-${{ github.run_id }}
          path: src/guest-runtime/release-bundle
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out trusted publish tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download validated runtime bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: runtime-release-${{ inputs.version }}-${{ github.run_id }}
          path: release-bundle

      - name: Publish runtime release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/publish-release.sh publish release-bundle
