name: Runtime Release
run-name: Release ${{ inputs.version }} @${{ inputs.source_sha }} [accelerator=${{ inputs.accelerator_version }},sandboxer=${{ inputs.sandboxer_version }}]
'on':
  workflow_dispatch:
    inputs:
      version:
        description: Runtime version in runtime-vX.Y.Z or runtime-vX.Y.Z-preview.YYYYMMDD[.N] form
        required: true
        type: string
      sandboxer_version:
        description: Published stable or preview sandboxer version embedded as sandbox-init
        required: true
        type: string
      accelerator_version:
        description: Published accelerator version used to build flatten-ctl
        required: true
        type: string
      source_ref:
        description: Exact source branch selected by the platform release controller
        required: true
        type: string
      source_sha:
        description: Exact source commit selected from source_ref
        required: true
        type: string
      aggregate_version:
        description: Owning aggregate Preview; required when version is a Preview
        required: false
        type: string
      aggregate_sha:
        description: Platform commit selecting aggregate_version; required for a Preview
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: component-mutation-${{ github.repository }}-${{ inputs.version }}
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      preview_manifest_digest: ${{ steps.request.outputs.preview_manifest_digest }}
      accelerator_version: ${{ steps.request.outputs.accelerator_version }}
      sandboxer_version: ${{ steps.request.outputs.sandboxer_version }}
      source_ref: ${{ steps.request.outputs.source_ref }}
      source_sha: ${{ steps.request.outputs.source_sha }}
      version: ${{ steps.request.outputs.version }}
      framework_sha: ${{ steps.framework.outputs.sha }}
      accelerator_sha: ${{ steps.dependencies.outputs.accelerator_sha }}
      sandboxer_sha: ${{ steps.dependencies.outputs.sandboxer_sha }}
    steps:
      - name: Require trusted release controller
        run: |
          set -euo pipefail
          [ "$GITHUB_REF" = refs/heads/main ] \
            || { echo "Runtime Release must run from main" >&2; exit 1; }
      - name: Check out trusted release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check out trusted platform tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: kuasar-sandbox/kuasar-sandbox
          ref: main
          path: trusted/platform
          persist-credentials: false
      - name: Bootstrap standard runner
        run: |
          bash trusted/platform/ci/hosted/bootstrap.sh --profile release-control
      - name: Record exact framework revision
        id: framework
        run: |
          echo "sha=$(git -C trusted/platform rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Select verified Workbench images once
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 trusted/platform/ci/hosted/workbench.py select \
            --framework-sha "${{ steps.framework.outputs.sha }}" --output workbench.json
      - name: Check environment GitHub CLI
        run: |
          gh --version
          gh_help="$(gh api --help)"
          [[ "$gh_help" == *--slurp* ]] || { echo "environment gh must support api --slurp" >&2; exit 1; }
      - name: Validate hosted workflow contracts
        run: python3 scripts/ci-test-workflows.py
      - name: Validate release request
        id: request
        env:
          GH_TOKEN: ${{ github.token }}
          ACCELERATOR_VERSION: ${{ inputs.accelerator_version }}
          SOURCE_REF: ${{ inputs.source_ref }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          AGGREGATE_VERSION: ${{ inputs.aggregate_version }}
          AGGREGATE_SHA: ${{ inputs.aggregate_sha }}
          PREVIEW_EVIDENCE_OUTPUT: preview-evidence.json
          VERSION: ${{ inputs.version }}
          SANDBOXER_VERSION: ${{ inputs.sandboxer_version }}
          TARGET_ARCH: all
          RELEASE_KIND: runtime
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^runtime-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-preview\.[0-9]{8}(\.[1-9][0-9]*)?)?$ ]] \
            || { echo "version must match runtime-vX.Y.Z or runtime-vX.Y.Z-preview.YYYYMMDD[.N]" >&2; exit 1; }
          [[ "$SANDBOXER_VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-preview\.[0-9]{8}(\.[1-9][0-9]*)?)?$ ]] \
            || { echo "sandboxer_version must match vX.Y.Z or vX.Y.Z-preview.YYYYMMDD[.N]" >&2; exit 1; }
          [[ "$ACCELERATOR_VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-preview\.[0-9]{8}(\.[1-9][0-9]*)?)?$ ]] \
            || { echo "accelerator_version must match vX.Y.Z or vX.Y.Z-preview.YYYYMMDD[.N]" >&2; exit 1; }
          bash scripts/validate-release-source.sh \
            "$SOURCE_REF" "$SOURCE_SHA" "$VERSION" runtime
          bash scripts/validate-preview-line.sh \
            runtime "$VERSION" "$AGGREGATE_VERSION" "$AGGREGATE_SHA"
          bash scripts/publish-release.sh check "$VERSION" "$TARGET_ARCH"
          {
            echo "accelerator_version=$ACCELERATOR_VERSION"
            echo "version=$VERSION"
            echo "sandboxer_version=$SANDBOXER_VERSION"
            echo "source_ref=$SOURCE_REF"
            echo "source_sha=$SOURCE_SHA"
          } >> "$GITHUB_OUTPUT"
      - name: Resolve exact public dependency releases
        id: dependencies
        env:
          GH_TOKEN: ${{ github.token }}
          ACCELERATOR_VERSION: ${{ steps.request.outputs.accelerator_version }}
          SANDBOXER_VERSION: ${{ steps.request.outputs.sandboxer_version }}
        run: |
          set -euo pipefail
          repository=kuasar-sandbox/accelerator
          version=$ACCELERATOR_VERSION
          gh api "repos/$repository" --jq 'select(.visibility == "public" and .private == false) | .full_name' | grep -Fx "$repository"
          sha=$(gh api "repos/$repository/git/ref/tags/$version" --jq 'select(.object.type == "commit") | .object.sha')
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          release=$(gh api "repos/$repository/releases/tags/$version")
          jq -e --arg tag "$version" --arg sha "$sha" '.tag_name == $tag and .target_commitish == $sha and .draft == false' <<< "$release" >/dev/null
          echo "accelerator_sha=$sha" >> "$GITHUB_OUTPUT"
          repository=kuasar-sandbox/sandboxer
          version=$SANDBOXER_VERSION
          gh api "repos/$repository" --jq 'select(.visibility == "public" and .private == false) | .full_name' | grep -Fx "$repository"
          sha=$(gh api "repos/$repository/git/ref/tags/$version" --jq 'select(.object.type == "commit") | .object.sha')
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          release=$(gh api "repos/$repository/releases/tags/$version")
          jq -e --arg tag "$version" --arg sha "$sha" '.tag_name == $tag and .target_commitish == $sha and .draft == false' <<< "$release" >/dev/null
          echo "sandboxer_sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Freeze admitted source and selected dependency tags
        env:
          SOURCE_REF: ${{ steps.request.outputs.source_ref }}
          SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
          ACCELERATOR_TAG: ${{ steps.request.outputs.accelerator_version }}
          ACCELERATOR_SHA: ${{ steps.dependencies.outputs.accelerator_sha }}
          SANDBOXER_TAG: ${{ steps.request.outputs.sandboxer_version }}
          SANDBOXER_SHA: ${{ steps.dependencies.outputs.sandboxer_sha }}
        run: |
          set -euo pipefail
          dependencies=()
          dependencies+=(--dependency accelerator "$ACCELERATOR_TAG" "$ACCELERATOR_SHA")
          dependencies+=(--dependency sandboxer "$SANDBOXER_TAG" "$SANDBOXER_SHA")
          python3 -B trusted/platform/release/producer-inputs.py freeze runtime "$SOURCE_REF" "$SOURCE_SHA" producer-inputs.tar "${dependencies[@]}"
      - name: Upload Workbench selection
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: runtime-workbench-${{ github.run_id }}
          path: |
            workbench.json
            producer-inputs.tar
            preview-evidence.json
          if-no-files-found: error
          retention-days: 1

    if: github.event.repository.visibility == 'public' && github.event.repository.full_name == github.repository
  build:
    needs: preflight
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    permissions:
      contents: read
    env:
      TARGET_ARCH: ${{ matrix.arch }}
      GOWORK: 'off'
      ACCELERATOR_VERSION: ${{ needs.preflight.outputs.accelerator_version }}
      SANDBOXER_VERSION: ${{ needs.preflight.outputs.sandboxer_version }}
    steps:
      - name: Check out trusted platform tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: kuasar-sandbox/kuasar-sandbox
          ref: ${{ needs.preflight.outputs.framework_sha }}
          path: trusted/platform
          persist-credentials: false
      - name: Download Workbench selection
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: runtime-workbench-${{ github.run_id }}
          path: workbench-selection
      - name: Check out trusted build checks
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: trusted/guest-runtime
          persist-credentials: false
      - name: Verify dependency releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for dependency in \
            "accelerator $ACCELERATOR_VERSION" \
            "sandboxer $SANDBOXER_VERSION"
          do
            read -r repository version <<< "$dependency"
            prerelease=false
            [[ "$version" != *-preview.* ]] || prerelease=true
            curl --fail --show-error --silent \
              --retry 4 --retry-all-errors --connect-timeout 10 --max-time 60 \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/kuasar-sandbox/$repository/releases/tags/$version" \
              > "$repository-release.json"
            jq -e --arg version "$version" --argjson prerelease "$prerelease" \
              '.tag_name == $version and .draft == false and .prerelease == $prerelease' \
              "$repository-release.json" >/dev/null
          done
      - name: Download the selected sandboxer release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p selected-sandboxer
          headers=$(mktemp)
          trap 'rm -f "$headers"' EXIT
          for name in "sandboxer-${SANDBOXER_VERSION}-linux-${TARGET_ARCH}.tar.gz" SHA256SUMS; do
            url=$(jq -er --arg name "$name" '
              [.assets[] | select(.name == $name)] | select(length == 1) | .[0].url
              | select(test("^https://api.github.com/repos/kuasar-sandbox/sandboxer/releases/assets/[0-9]+$"))
            ' sandboxer-release.json)
            output="selected-sandboxer/$name"
            : > "$output"
            # A new curl process recalculates the resume offset after each failure.
            for attempt in 1 2 3 4 5; do
              if curl --fail --show-error --silent --location \
                --continue-at - --connect-timeout 10 --max-time 600 --dump-header "$headers" \
                -H "Accept: application/octet-stream" \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "$url" --output "$output"; then
                break
              fi
              if [[ "$attempt" == 5 ]]; then
                echo "release: asset download failed after $attempt attempts: $name" >&2
                exit 1
              fi
              delay=$(python3 - "$headers" "$attempt" <<'PY'
          import email.utils
          import math
          import pathlib
          import sys
          import time

          retry_after = ""
          for line in pathlib.Path(sys.argv[1]).read_text(encoding="iso-8859-1").splitlines():
              if line.startswith("HTTP/"):
                  retry_after = ""
              name, separator, value = line.partition(":")
              if separator and name.lower() == "retry-after":
                  retry_after = value.strip()
          delay = 1 << (int(sys.argv[2]) - 1)
          try:
              if retry_after.isascii() and retry_after.isdecimal():
                  requested = int(retry_after)
              else:
                  requested = math.ceil(email.utils.parsedate_to_datetime(retry_after).timestamp() - time.time())
              delay = max(delay, requested)
          except (ValueError, TypeError, OverflowError):
              pass
          print(delay)
          PY
              )
              sleep "$delay"
            done
          done
      - name: Restore fixed producer inputs
        env:
          SOURCE_SHA: ${{ needs.preflight.outputs.source_sha }}
        run: python3 -B trusted/platform/release/producer-inputs.py restore workbench-selection/producer-inputs.tar runtime "$SOURCE_SHA" src --dependency accelerator "${{ needs.preflight.outputs.accelerator_version }}" "${{ needs.preflight.outputs.accelerator_sha }}" --dependency sandboxer "${{ needs.preflight.outputs.sandboxer_version }}" "${{ needs.preflight.outputs.sandboxer_sha }}"
      - name: Freeze clean source cache trust before installing verified assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -B - <<'PY'
          import hashlib, os, pathlib, subprocess, sys
          sources = pathlib.Path('src').resolve()
          source_hash = hashlib.sha256(str(sources).encode()).hexdigest()
          receipt = pathlib.Path(os.environ['RUNNER_TEMP']) / (
              'workbench-cache-scope-' + os.environ['GITHUB_RUN_ID'] + '-' + source_hash + '.json')
          subprocess.run([sys.executable, '-B', 'trusted/platform/ci/hosted/workbench.py', 'cache-scope',
                          '--sources', sources, '--receipt', receipt], check=True)
          PY
      - name: Verify and install the selected sandbox-init
        run: |
          set -euo pipefail
          python3 trusted/guest-runtime/scripts/prepare-sandbox-init.py \
            --release-json sandboxer-release.json --directory selected-sandboxer \
            --version "$SANDBOXER_VERSION" --arch "$TARGET_ARCH" \
            --source-sha "$(git -C src/sandboxer rev-parse HEAD)" \
            --output "src/sandboxer/bin/$TARGET_ARCH/sandbox-init" \
            --go-toolchain-output "$GITHUB_WORKSPACE/src/selected-sandboxer-go"
      - name: Build test and package runtime image
        uses: ./trusted/platform/.github/actions/workbench
        with:
          selection: workbench-selection/workbench.json
          sources: src
          cache-coverage: release-runtime-build
          outputs: |
            guest-runtime/bin/${{ matrix.arch }}/flatten-ctl
            guest-runtime/native-deps/bin/${{ matrix.arch }}/envd
            guest-runtime/native-deps/bin/${{ matrix.arch }}/mkfs.erofs
            guest-runtime/native-deps/bin/${{ matrix.arch }}/fsck.erofs
            sandboxer/bin/${{ matrix.arch }}/sandbox-init
            guest-runtime/release-bundle
          arch: ${{ matrix.arch }}
          cpus: '2'
          memory-gib: '8'
          run: |
            set -euo pipefail
            export GOWORK=off
            bash /inputs/release/ci/native-cache/native-cache.sh restore-or-build erofs
            bash /inputs/release/ci/native-cache/native-cache.sh restore-or-build envd
            if [ "$TARGET_ARCH" = x86_64 ]; then make -C guest-runtime test; make -C guest-runtime vet; fi
            make -C guest-runtime flatten-ctl
            make -C guest-runtime sandbox-runtime BUILD_MKFS_EROFS="/src/guest-runtime/native-deps/bin/$TARGET_ARCH/mkfs.erofs"
            cd /src/guest-runtime
            export GOWORK=off
            export VERSION='${{ needs.preflight.outputs.version }}'
            export ACCELERATOR_VERSION='${{ needs.preflight.outputs.accelerator_version }}'
            export SANDBOXER_VERSION='${{ needs.preflight.outputs.sandboxer_version }}'
            export RELEASE_MATERIALS_GO_NOTICE_ROOT=/src/selected-sandboxer-go
            [ "$(git rev-parse HEAD)" = "${{ needs.preflight.outputs.source_sha }}" ]
            export SOURCE_DATE_EPOCH
            SOURCE_DATE_EPOCH=$(git show -s --format=%ct "${{ needs.preflight.outputs.source_sha }}")
            bash scripts/release.sh package runtime "$VERSION" "$TARGET_ARCH" release-bundle
            bash scripts/release.sh validate runtime "$VERSION" "$TARGET_ARCH" release-bundle
      - name: Check the released Runtime ABI
        run: |
          python3 trusted/guest-runtime/scripts/ci-check-runtime-abi.py \
            --static src/guest-runtime/bin/$TARGET_ARCH/flatten-ctl \
            --static src/guest-runtime/native-deps/bin/$TARGET_ARCH/envd \
            --static src/guest-runtime/native-deps/bin/$TARGET_ARCH/mkfs.erofs \
            --static src/guest-runtime/native-deps/bin/$TARGET_ARCH/fsck.erofs \
            src/sandboxer/bin/$TARGET_ARCH/sandbox-init
      - name: Upload validated runtime bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: runtime-release-${{ needs.preflight.outputs.version }}-${{ matrix.arch }}-${{ github.run_id }}
          path: src/guest-runtime/release-bundle
          if-no-files-found: error
          retention-days: 1
    if: github.event.repository.visibility == 'public' && github.event.repository.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
  publish:
    needs:
      - preflight
      - build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out trusted publish tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check out trusted platform tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: kuasar-sandbox/kuasar-sandbox
          ref: ${{ needs.preflight.outputs.framework_sha }}
          path: trusted/platform
          persist-credentials: false
      - name: Bootstrap standard runner
        run: |
          bash trusted/platform/ci/hosted/bootstrap.sh --profile release-control
      - name: Download Workbench selection
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: runtime-workbench-${{ github.run_id }}
          path: workbench-selection
      - name: Prepare private reader output
        run: mkdir workbench-host-tools
      - name: Export verified Workbench Runtime readers
        uses: ./trusted/platform/.github/actions/workbench
        with:
          selection: workbench-selection/workbench.json
          sources: workbench-host-tools
          outputs: |
            bin/fsck.erofs
            bin/dump.erofs
          arch: x86_64
          cache: 'false'
          cpus: '2'
          memory-gib: '8'
          run: |
            set -euo pipefail
            mkdir /src/bin
            cp "$(command -v fsck.erofs)" "$(command -v dump.erofs)" /src/bin/
      - name: Check and select exact Runtime readers
        run: |
          set -euo pipefail
          for reader in fsck.erofs dump.erofs; do
            dependencies=$(ldd "workbench-host-tools/bin/$reader")
            [[ "$dependencies" != *'not found'* ]] || { echo "$dependencies" >&2; exit 1; }
          done
          fsck_help=$(workbench-host-tools/bin/fsck.erofs --help 2>&1 || true)
          dump_help=$(workbench-host-tools/bin/dump.erofs --help 2>&1 || true)
          grep -Fq -- --extract <<< "$fsck_help"
          grep -Fq -- --path <<< "$dump_help"
          grep -Fq -- --cat <<< "$dump_help"
          echo "$GITHUB_WORKSPACE/workbench-host-tools/bin" >> "$GITHUB_PATH"
      - name: Check environment GitHub CLI
        run: |
          gh --version
          gh_help="$(gh api --help)"
          [[ "$gh_help" == *--slurp* ]] || { echo "environment gh must support api --slurp" >&2; exit 1; }
      - name: Download validated x86_64 bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: runtime-release-${{ needs.preflight.outputs.version }}-x86_64-${{ github.run_id }}
          path: staged/x86_64
      - name: Download validated aarch64 bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: runtime-release-${{ needs.preflight.outputs.version }}-aarch64-${{ github.run_id }}
          path: staged/aarch64
      - name: Restore selected source objects for material validation
        env:
          SOURCE_SHA: ${{ needs.preflight.outputs.source_sha }}
        run: |
          set -euo pipefail
          python3 -B trusted/platform/release/producer-inputs.py restore workbench-selection/producer-inputs.tar runtime "$SOURCE_SHA" publisher-inputs --dependency accelerator "${{ needs.preflight.outputs.accelerator_version }}" "${{ needs.preflight.outputs.accelerator_sha }}" --dependency sandboxer "${{ needs.preflight.outputs.sandboxer_version }}" "${{ needs.preflight.outputs.sandboxer_sha }}"
          # Import only the already admitted run input into the trusted validator.
          git -c core.hooksPath=/dev/null fetch --no-tags ./publisher-inputs/guest-runtime HEAD
          git cat-file -e "$SOURCE_SHA^{commit}"
      - name: Assemble the two validated architecture archives
        env:
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.preflight.outputs.version }}
          SOURCE_SHA: ${{ needs.preflight.outputs.source_sha }}
          RELEASE_KIND: runtime
        run: |
          bash scripts/publish-release.sh assemble "$VERSION" staged/x86_64 staged/aarch64 release-bundle
      - name: Publish runtime release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.preflight.outputs.version }}
          TARGET_ARCH: all
          RELEASE_KIND: runtime
          SOURCE_REF: ${{ needs.preflight.outputs.source_ref }}
          SOURCE_SHA: ${{ needs.preflight.outputs.source_sha }}
          AGGREGATE_VERSION: ${{ inputs.aggregate_version }}
          AGGREGATE_SHA: ${{ inputs.aggregate_sha }}
          PREVIEW_EVIDENCE_FILE: workbench-selection/preview-evidence.json
          PREVIEW_EVIDENCE_DIGEST: ${{ needs.preflight.outputs.preview_manifest_digest }}
          RELEASE_DEPENDENCIES: accelerator=${{ needs.preflight.outputs.accelerator_version }},sandboxer=${{ needs.preflight.outputs.sandboxer_version }}
        run: |
          set -euo pipefail
          bash scripts/validate-preview-line.sh \
            runtime "$VERSION" "$AGGREGATE_VERSION" "$AGGREGATE_SHA"
          bash scripts/publish-release.sh publish \
            "$VERSION" "$TARGET_ARCH" "$SOURCE_SHA" release-bundle "$SOURCE_REF"
    if: github.event.repository.visibility == 'public' && github.event.repository.full_name == github.repository
  cleanup:
    needs:
      - preflight
      - publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write
      contents: read
    steps:
      - name: Check out trusted cleanup tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check out pinned hosted bootstrap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: kuasar-sandbox/kuasar-sandbox
          ref: ${{ needs.preflight.outputs.framework_sha }}
          path: trusted/platform
          sparse-checkout: |
            ci/hosted
            ci/native-cache
          persist-credentials: false
      - name: Bootstrap standard runner
        run: bash trusted/platform/ci/hosted/bootstrap.sh --profile control
      - name: Check environment GitHub CLI
        run: |
          gh --version
          gh_help="$(gh api --help)"
          [[ "$gh_help" == *--slurp* ]] || { echo "environment gh must support api --slurp" >&2; exit 1; }
      - name: Delete release workflow artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          artifact_id_lines=$(gh api --paginate \
            "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" \
            --jq '.artifacts[].id')
          artifact_ids=()
          if [[ -n "$artifact_id_lines" ]]; then
            mapfile -t artifact_ids <<< "$artifact_id_lines"
          fi
          for artifact_id in "${artifact_ids[@]}"; do
            [[ "$artifact_id" =~ ^[0-9]+$ ]]
            gh api --method DELETE \
              "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id" \
              --silent
          done
          echo "deleted ${#artifact_ids[@]} release workflow artifact(s)"
    if: github.event.repository.visibility == 'public' && github.event.repository.full_name == github.repository
