name: Vmlinux Release
run-name: Release ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Kernel version in vmlinux-vX.Y.Z or vmlinux-vX.Y.Z-preview.YYYYMMDD form
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: vmlinux-release-${{ github.repository }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      version: ${{ steps.request.outputs.version }}
    steps:
      - name: Check out trusted release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate release request
        id: request
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          TARGET_ARCH: x86_64
          RELEASE_KIND: vmlinux
        run: |
          set -euo pipefail
          [ "$GITHUB_REF" = refs/heads/main ] \
            || { echo "Vmlinux Release must run from main" >&2; exit 1; }
          [[ "$VERSION" =~ ^vmlinux-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-preview\.[0-9]{8})?$ ]] \
            || { echo "version must match vmlinux-vX.Y.Z or vmlinux-vX.Y.Z-preview.YYYYMMDD" >&2; exit 1; }
          bash scripts/publish-release.sh check "$VERSION" "$TARGET_ARCH"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build:
    needs: preflight
    runs-on:
      - self-hosted
      - Linux
      - X64
      - kuasar-e2e
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      TARGET_ARCH: x86_64
    steps:
      - name: Create read-only source token
        id: source-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.KUASAR_CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.KUASAR_CI_APP_PRIVATE_KEY }}
          owner: kuasar-sandbox
          repositories: guest-runtime,kuasar-sandbox
          permission-contents: read
          skip-token-revoke: true

      - name: Check out exact guest-runtime source
        id: checkout-guest-runtime
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kuasar-sandbox/guest-runtime
          ref: ${{ github.sha }}
          path: src/guest-runtime
          token: ${{ steps.source-token.outputs.token }}
          persist-credentials: false

      - name: Retry exact guest-runtime source checkout
        if: steps.checkout-guest-runtime.outcome == 'failure'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kuasar-sandbox/guest-runtime
          ref: ${{ github.sha }}
          path: src/guest-runtime
          token: ${{ steps.source-token.outputs.token }}
          persist-credentials: false

      - name: Check out pinned native cache tooling
        id: checkout-platform
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kuasar-sandbox/kuasar-sandbox
          ref: caf322e48fc11c96a5e4984b91d6ee7cba68a991
          path: src/platform
          token: ${{ steps.source-token.outputs.token }}
          persist-credentials: false

      - name: Retry native cache tooling checkout
        if: steps.checkout-platform.outcome == 'failure'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kuasar-sandbox/kuasar-sandbox
          ref: caf322e48fc11c96a5e4984b91d6ee7cba68a991
          path: src/platform
          token: ${{ steps.source-token.outputs.token }}
          persist-credentials: false

      - name: Revoke source token before code execution
        if: ${{ always() && steps.source-token.outputs.token != '' }}
        env:
          GH_TOKEN: ${{ steps.source-token.outputs.token }}
        run: |
          set -euo pipefail
          status=$(curl --show-error --silent \
            --retry 4 --retry-all-errors --connect-timeout 10 --max-time 60 \
            --request DELETE \
            --output /dev/null \
            --write-out '%{http_code}' \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/installation/token)
          case "$status" in
            204|401) ;;
            *) echo "failed to revoke source token: HTTP $status" >&2; exit 1 ;;
          esac

      - name: Attach source cache
        run: |
          set -euo pipefail
          install -d -m 0755 /var/cache/kuasar/tarballs
          mkdir -p src/guest-runtime/native-deps/build
          ln -sfn /var/cache/kuasar/tarballs src/guest-runtime/native-deps/build/tarball
          linux_file=$(awk '/^LINUX_TARBALL[[:space:]]*\?=/ { url=$3; sub(/\\#.*/, "", url); n=split(url, part, "/"); print part[n]; exit }' src/guest-runtime/native-deps/Makefile)
          [[ "$linux_file" =~ ^linux-([0-9]+)\..*\.tar\.gz$ ]]
          echo "LINUX_TARBALL=https://mirrors.tuna.tsinghua.edu.cn/kernel/v${BASH_REMATCH[1]}.x/$linux_file" >> "$GITHUB_ENV"

      - name: Restore or build guest kernel
        env:
          KUASAR_WORKSPACE_ROOT: ${{ github.workspace }}/src
        run: src/platform/ci/native-cache/native-cache.sh restore-or-build vmlinux

      - name: Validate native dependency scripts
        run: make -C src/guest-runtime/native-deps test

      - name: Package vmlinux release
        working-directory: src/guest-runtime
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          [ "$(git rev-parse HEAD)" = "$GITHUB_SHA" ]
          export SOURCE_DATE_EPOCH
          SOURCE_DATE_EPOCH=$(git show -s --format=%ct "$GITHUB_SHA")
          bash scripts/release.sh package vmlinux "$VERSION" "$TARGET_ARCH" \
            release-bundle

      - name: Upload validated vmlinux bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vmlinux-release-${{ needs.preflight.outputs.version }}-${{ github.run_id }}
          path: src/guest-runtime/release-bundle
          if-no-files-found: error
          retention-days: 1

  publish:
    needs:
      - preflight
      - build
    runs-on: ubuntu-latest
    concurrency:
      group: vmlinux-publish-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out trusted publish tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download validated vmlinux bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vmlinux-release-${{ needs.preflight.outputs.version }}-${{ github.run_id }}
          path: release-bundle

      - name: Publish vmlinux release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.preflight.outputs.version }}
          TARGET_ARCH: x86_64
          RELEASE_KIND: vmlinux
        run: |
          set -euo pipefail
          bash scripts/publish-release.sh publish \
            "$VERSION" "$TARGET_ARCH" "$GITHUB_SHA" release-bundle

  cleanup:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Delete release workflow artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          artifact_id_lines=$(gh api --paginate \
            "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" \
            --jq '.artifacts[].id')
          artifact_ids=()
          if [[ -n "$artifact_id_lines" ]]; then
            mapfile -t artifact_ids <<< "$artifact_id_lines"
          fi
          for artifact_id in "${artifact_ids[@]}"; do
            [[ "$artifact_id" =~ ^[0-9]+$ ]]
            gh api --method DELETE \
              "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id" \
              --silent
          done
          echo "deleted ${#artifact_ids[@]} release workflow artifact(s)"
