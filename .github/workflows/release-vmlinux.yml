name: Vmlinux Release
run-name: Release ${{ inputs.version }} @${{ inputs.source_sha }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Kernel version in vmlinux-vX.Y.Z or vmlinux-vX.Y.Z-preview.YYYYMMDD[.N] form
        required: true
        type: string
      source_ref:
        description: Exact source branch selected by the platform release controller
        required: true
        type: string
      source_sha:
        description: Exact source commit selected from source_ref
        required: true
        type: string
      aggregate_version:
        description: Owning aggregate Preview; required when version is a Preview
        required: false
        type: string
      aggregate_sha:
        description: Platform commit selecting aggregate_version; required for a Preview
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: component-mutation-${{ github.repository }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    outputs:
      source_ref: ${{ steps.request.outputs.source_ref }}
      source_sha: ${{ steps.request.outputs.source_sha }}
      version: ${{ steps.request.outputs.version }}
    steps:
      - name: Require trusted release controller
        run: |
          set -euo pipefail
          [ "$GITHUB_REF" = refs/heads/main ] \
            || { echo "Vmlinux Release must run from main" >&2; exit 1; }

      - name: Check out trusted release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out pinned hosted bootstrap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kuasar-sandbox/kuasar-sandbox
          # Publish this platform commit before activating the guest workflow pin.
          ref: 5b009f1509ff8b6bade4445d9a023ea8742f81cc
          path: trusted/platform
          sparse-checkout: |
            ci/hosted
            ci/native-cache
          persist-credentials: false

      - name: Bootstrap standard runner
        run: bash trusted/platform/ci/hosted/bootstrap.sh --profile release-control

      - name: Install pinned GitHub CLI
        run: bash scripts/install-gh-cli.sh

      - name: Validate hosted workflow contracts
        run: python3 scripts/ci-test-workflows.py

      - name: Validate release request
        id: request
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REF: ${{ inputs.source_ref }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          AGGREGATE_VERSION: ${{ inputs.aggregate_version }}
          AGGREGATE_SHA: ${{ inputs.aggregate_sha }}
          VERSION: ${{ inputs.version }}
          TARGET_ARCH: x86_64
          RELEASE_KIND: vmlinux
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^vmlinux-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-preview\.[0-9]{8}(\.[1-9][0-9]*)?)?$ ]] \
            || { echo "version must match vmlinux-vX.Y.Z or vmlinux-vX.Y.Z-preview.YYYYMMDD[.N]" >&2; exit 1; }
          bash scripts/validate-release-source.sh \
            "$SOURCE_REF" "$SOURCE_SHA" "$VERSION" vmlinux
          bash scripts/validate-preview-line.sh \
            vmlinux "$VERSION" "$AGGREGATE_VERSION" "$AGGREGATE_SHA"
          bash scripts/publish-release.sh check "$VERSION" "$TARGET_ARCH"
          {
            echo "source_ref=$SOURCE_REF"
            echo "source_sha=$SOURCE_SHA"
            echo "version=$VERSION"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
    env:
      TARGET_ARCH: x86_64
    steps:
      - name: Check out pinned hosted bootstrap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kuasar-sandbox/kuasar-sandbox
          # Publish this platform commit before activating the guest workflow pin.
          ref: 5b009f1509ff8b6bade4445d9a023ea8742f81cc
          path: trusted/platform
          sparse-checkout: |
            ci/hosted
            ci/native-cache
          persist-credentials: false

      - name: Bootstrap standard runner
        run: bash trusted/platform/ci/hosted/bootstrap.sh --profile kernel

      - name: Check out exact guest-runtime source
        id: checkout-guest-runtime
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kuasar-sandbox/guest-runtime
          ref: ${{ needs.preflight.outputs.source_sha }}
          path: src/guest-runtime
          persist-credentials: false

      - name: Retry exact guest-runtime source checkout
        if: steps.checkout-guest-runtime.outcome == 'failure'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kuasar-sandbox/guest-runtime
          ref: ${{ needs.preflight.outputs.source_sha }}
          path: src/guest-runtime
          persist-credentials: false

      - name: Attach job-local source cache
        run: |
          set -euo pipefail
          mkdir -p src/guest-runtime/native-deps/build
          ln -sfn "$KUASAR_TARBALL_CACHE" src/guest-runtime/native-deps/build/tarball

      - name: Restore or build guest kernel
        env:
          KUASAR_WORKSPACE_ROOT: ${{ github.workspace }}/src
        shell: bash
        run: |
          taskset -pc "$KUASAR_BUILD_CPUS" "$$" >/dev/null
          trusted/platform/ci/native-cache/native-cache.sh restore-or-build vmlinux

      - name: Validate native dependency scripts
        run: make -C src/guest-runtime/native-deps test-scripts

      - name: Package vmlinux release
        working-directory: src/guest-runtime
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          [ "$(git rev-parse HEAD)" = "${{ needs.preflight.outputs.source_sha }}" ]
          export SOURCE_DATE_EPOCH
          SOURCE_DATE_EPOCH=$(git show -s --format=%ct "${{ needs.preflight.outputs.source_sha }}")
          bash scripts/release.sh package vmlinux "$VERSION" "$TARGET_ARCH" \
            release-bundle

      - name: Upload validated vmlinux bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vmlinux-release-${{ needs.preflight.outputs.version }}-${{ github.run_id }}
          path: src/guest-runtime/release-bundle
          if-no-files-found: error
          retention-days: 1

  publish:
    needs:
      - preflight
      - build
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out trusted publish tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out pinned hosted bootstrap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kuasar-sandbox/kuasar-sandbox
          # Publish this platform commit before activating the guest workflow pin.
          ref: 5b009f1509ff8b6bade4445d9a023ea8742f81cc
          path: trusted/platform
          sparse-checkout: |
            ci/hosted
            ci/native-cache
          persist-credentials: false

      - name: Bootstrap standard runner
        run: bash trusted/platform/ci/hosted/bootstrap.sh --profile release-control

      - name: Install pinned GitHub CLI
        run: bash scripts/install-gh-cli.sh

      - name: Download validated vmlinux bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vmlinux-release-${{ needs.preflight.outputs.version }}-${{ github.run_id }}
          path: release-bundle

      - name: Publish vmlinux release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.preflight.outputs.version }}
          TARGET_ARCH: x86_64
          RELEASE_KIND: vmlinux
          SOURCE_REF: ${{ needs.preflight.outputs.source_ref }}
          SOURCE_SHA: ${{ needs.preflight.outputs.source_sha }}
          AGGREGATE_VERSION: ${{ inputs.aggregate_version }}
          AGGREGATE_SHA: ${{ inputs.aggregate_sha }}
        run: |
          set -euo pipefail
          bash scripts/validate-preview-line.sh \
            vmlinux "$VERSION" "$AGGREGATE_VERSION" "$AGGREGATE_SHA"
          bash scripts/publish-release.sh publish \
            "$VERSION" "$TARGET_ARCH" "$SOURCE_SHA" release-bundle "$SOURCE_REF"

  cleanup:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: write
      contents: read
    steps:
      - name: Check out trusted cleanup tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out pinned hosted bootstrap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kuasar-sandbox/kuasar-sandbox
          # Publish this platform commit before activating the guest workflow pin.
          ref: 5b009f1509ff8b6bade4445d9a023ea8742f81cc
          path: trusted/platform
          sparse-checkout: |
            ci/hosted
            ci/native-cache
          persist-credentials: false

      - name: Bootstrap standard runner
        run: bash trusted/platform/ci/hosted/bootstrap.sh --profile control

      - name: Install pinned GitHub CLI
        run: bash scripts/install-gh-cli.sh

      - name: Delete release workflow artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          artifact_id_lines=$(gh api --paginate \
            "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" \
            --jq '.artifacts[].id')
          artifact_ids=()
          if [[ -n "$artifact_id_lines" ]]; then
            mapfile -t artifact_ids <<< "$artifact_id_lines"
          fi
          for artifact_id in "${artifact_ids[@]}"; do
            [[ "$artifact_id" =~ ^[0-9]+$ ]]
            gh api --method DELETE \
              "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id" \
              --silent
          done
          echo "deleted ${#artifact_ids[@]} release workflow artifact(s)"
