name: Vmlinux Release
run-name: ${{ github.event_name == 'schedule' && 'Daily vmlinux-v0.1.0 preview' || format('Release {0}', inputs.version) }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Kernel version in vmlinux-vX.Y.Z or vmlinux-vX.Y.Z-preview.YYYYMMDD form
        required: true
        type: string
  schedule:
    - cron: "22 2 * * *"
      timezone: Asia/Shanghai
    - cron: "22 4 * * *"
      timezone: Asia/Shanghai

permissions:
  contents: read

concurrency:
  group: vmlinux-release-${{ github.repository }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      publish: ${{ steps.request.outputs.publish }}
      version: ${{ steps.request.outputs.version }}
    steps:
      - name: Check out trusted release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve release request
        id: request
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [ "$GITHUB_REF" = refs/heads/main ] \
            || { echo "Vmlinux Release must run from main" >&2; exit 1; }
          if [ "$GITHUB_EVENT_NAME" = schedule ]; then
            if gh api "repos/$GITHUB_REPOSITORY/releases/tags/vmlinux-v0.1.0" >/dev/null 2>&1; then
              echo "version=vmlinux-v0.1.0" >> "$GITHUB_OUTPUT"
              echo "publish=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            created_at=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .created_at)
            VERSION="vmlinux-v0.1.0-preview.$(TZ=Asia/Shanghai date -d "$created_at" +%Y%m%d)"
            if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$VERSION" > existing.json 2>/dev/null; then
              jq -e --arg version "$VERSION" \
                '.tag_name == $version and .draft == false and .prerelease == true' \
                existing.json >/dev/null
              echo "version=$VERSION" >> "$GITHUB_OUTPUT"
              echo "publish=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          else
            VERSION="$INPUT_VERSION"
          fi
          [[ "$VERSION" =~ ^vmlinux-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-preview\.[0-9]{8})?$ ]] \
            || { echo "version must match vmlinux-vX.Y.Z or vmlinux-vX.Y.Z-preview.YYYYMMDD" >&2; exit 1; }
          bash scripts/publish-release.sh check "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "publish=true" >> "$GITHUB_OUTPUT"

  build:
    needs: preflight
    if: needs.preflight.outputs.publish == 'true'
    runs-on:
      - self-hosted
      - Linux
      - X64
      - kuasar-e2e
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      TARGET_ARCH: x86_64
    steps:
      - name: Create read-only source token
        id: source-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.KUASAR_CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.KUASAR_CI_APP_PRIVATE_KEY }}
          owner: kuasar-sandbox
          repositories: guest-runtime,orchestrator
          permission-contents: read
          skip-token-revoke: true

      - name: Check out exact guest-runtime source
        id: checkout-guest-runtime
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kuasar-sandbox/guest-runtime
          ref: ${{ github.sha }}
          path: src/guest-runtime
          token: ${{ steps.source-token.outputs.token }}
          persist-credentials: false

      - name: Retry exact guest-runtime source checkout
        if: steps.checkout-guest-runtime.outcome == 'failure'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kuasar-sandbox/guest-runtime
          ref: ${{ github.sha }}
          path: src/guest-runtime
          token: ${{ steps.source-token.outputs.token }}
          persist-credentials: false

      - name: Check out native cache tooling
        id: checkout-orchestrator
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kuasar-sandbox/orchestrator
          ref: main
          path: src/orchestrator
          token: ${{ steps.source-token.outputs.token }}
          persist-credentials: false

      - name: Retry native cache tooling checkout
        if: steps.checkout-orchestrator.outcome == 'failure'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kuasar-sandbox/orchestrator
          ref: main
          path: src/orchestrator
          token: ${{ steps.source-token.outputs.token }}
          persist-credentials: false

      - name: Revoke source token before code execution
        if: ${{ always() && steps.source-token.outputs.token != '' }}
        env:
          GH_TOKEN: ${{ steps.source-token.outputs.token }}
        run: |
          set -euo pipefail
          status=$(curl --show-error --silent \
            --retry 4 --retry-all-errors --connect-timeout 10 --max-time 60 \
            --request DELETE \
            --output /dev/null \
            --write-out '%{http_code}' \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/installation/token)
          case "$status" in
            204|401) ;;
            *) echo "failed to revoke source token: HTTP $status" >&2; exit 1 ;;
          esac

      - name: Attach source cache
        run: |
          set -euo pipefail
          install -d -m 0755 /var/cache/kuasar/tarballs
          mkdir -p src/guest-runtime/native-deps/build
          ln -sfn /var/cache/kuasar/tarballs src/guest-runtime/native-deps/build/tarball
          linux_file=$(awk '/^LINUX_TARBALL[[:space:]]*\?=/ { url=$3; sub(/\\#.*/, "", url); n=split(url, part, "/"); print part[n]; exit }' src/guest-runtime/native-deps/Makefile)
          [[ "$linux_file" =~ ^linux-([0-9]+)\..*\.tar\.gz$ ]]
          echo "LINUX_TARBALL=https://mirrors.tuna.tsinghua.edu.cn/kernel/v${BASH_REMATCH[1]}.x/$linux_file" >> "$GITHUB_ENV"

      - name: Restore or build guest kernel
        env:
          KUASAR_WORKSPACE_ROOT: ${{ github.workspace }}/src
        run: src/orchestrator/release-builder/scripts/native-cache.sh restore-or-build vmlinux

      - name: Validate native dependency scripts
        run: make -C src/guest-runtime/native-deps test

      - name: Package vmlinux release
        working-directory: src/guest-runtime
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
          RELEASE_WORKFLOW_REPOSITORY: ${{ github.repository }}
          RELEASE_WORKFLOW_RUN_ID: ${{ github.run_id }}
          RELEASE_WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
          RELEASE_WORKFLOW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          printf 'repository\trequested_ref\tresolved_sha\trole\n' > revisions.tsv
          printf 'kuasar-sandbox/guest-runtime\tmain\t%s\tprimary\n' \
            "$(git rev-parse HEAD)" >> revisions.tsv
          [ "$(git rev-parse HEAD)" = "$GITHUB_SHA" ]
          SOURCE_DATE_EPOCH=$(git show -s --format=%ct "$GITHUB_SHA")
          export SOURCE_DATE_EPOCH
          bash scripts/release.sh package vmlinux "$VERSION" "$TARGET_ARCH" \
            revisions.tsv release-bundle

      - name: Upload validated vmlinux bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vmlinux-release-${{ needs.preflight.outputs.version }}-${{ github.run_id }}
          path: src/guest-runtime/release-bundle
          if-no-files-found: error
          retention-days: 7

  publish:
    needs:
      - preflight
      - build
    runs-on: ubuntu-latest
    concurrency:
      group: vmlinux-publish-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out trusted publish tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download validated vmlinux bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vmlinux-release-${{ needs.preflight.outputs.version }}-${{ github.run_id }}
          path: release-bundle

      - name: Publish vmlinux release
        env:
          GH_TOKEN: ${{ github.token }}
          STABLE_VERSION: vmlinux-v0.1.0
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = schedule ]; then
            status=$(curl --show-error --silent \
              --retry 4 --retry-all-errors --connect-timeout 10 --max-time 60 \
              --output /dev/null --write-out '%{http_code}' \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$STABLE_VERSION")
            case "$status" in
              200) echo "stable release $STABLE_VERSION exists; skipping preview publication"; exit 0 ;;
              404) ;;
              *) echo "failed to check stable release $STABLE_VERSION: HTTP $status" >&2; exit 1 ;;
            esac
          fi
          bash scripts/publish-release.sh publish release-bundle
