name: Vmlinux Release
run-name: Release ${{ inputs.version }} @${{ inputs.source_sha }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Kernel version in vmlinux-vX.Y.Z or vmlinux-vX.Y.Z-preview.YYYYMMDD[.N] form
        required: true
        type: string
      source_ref:
        description: Exact source branch selected by the platform release controller
        required: true
        type: string
      source_sha:
        description: Exact source commit selected from source_ref
        required: true
        type: string
      aggregate_version:
        description: Owning aggregate Preview; required when version is a Preview
        required: false
        type: string
      aggregate_sha:
        description: Platform commit selecting aggregate_version; required for a Preview
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: component-mutation-${{ github.repository }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: [self-hosted, Linux, X64, kuasar-control]
    permissions:
      actions: read
      contents: read
    outputs:
      source_ref: ${{ steps.request.outputs.source_ref }}
      source_sha: ${{ steps.request.outputs.source_sha }}
      version: ${{ steps.request.outputs.version }}
    steps:
      - name: Require trusted release controller
        run: |
          set -euo pipefail
          [ "$GITHUB_REF" = refs/heads/main ] \
            || { echo "Vmlinux Release must run from main" >&2; exit 1; }

      - name: Check out trusted release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned GitHub CLI
        run: bash scripts/install-gh-cli.sh

      - name: Validate release request
        id: request
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REF: ${{ inputs.source_ref }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          AGGREGATE_VERSION: ${{ inputs.aggregate_version }}
          AGGREGATE_SHA: ${{ inputs.aggregate_sha }}
          VERSION: ${{ inputs.version }}
          TARGET_ARCH: x86_64
          RELEASE_KIND: vmlinux
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^vmlinux-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-preview\.[0-9]{8}(\.[1-9][0-9]*)?)?$ ]] \
            || { echo "version must match vmlinux-vX.Y.Z or vmlinux-vX.Y.Z-preview.YYYYMMDD[.N]" >&2; exit 1; }
          bash scripts/validate-release-source.sh \
            "$SOURCE_REF" "$SOURCE_SHA" "$VERSION" vmlinux
          bash scripts/validate-preview-line.sh \
            vmlinux "$VERSION" "$AGGREGATE_VERSION" "$AGGREGATE_SHA"
          bash scripts/publish-release.sh check "$VERSION" "$TARGET_ARCH"
          {
            echo "source_ref=$SOURCE_REF"
            echo "source_sha=$SOURCE_SHA"
            echo "version=$VERSION"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: preflight
    runs-on:
      - self-hosted
      - Linux
      - X64
      - kuasar-e2e
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      TARGET_ARCH: x86_64
    steps:
      - name: Create read-only source token
        id: source-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.KUASAR_CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.KUASAR_CI_APP_PRIVATE_KEY }}
          owner: kuasar-sandbox
          repositories: guest-runtime,kuasar-sandbox
          permission-contents: read
          skip-token-revoke: true

      - name: Check out exact guest-runtime source
        id: checkout-guest-runtime
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kuasar-sandbox/guest-runtime
          ref: ${{ needs.preflight.outputs.source_sha }}
          path: src/guest-runtime
          token: ${{ steps.source-token.outputs.token }}
          persist-credentials: false

      - name: Retry exact guest-runtime source checkout
        if: steps.checkout-guest-runtime.outcome == 'failure'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kuasar-sandbox/guest-runtime
          ref: ${{ needs.preflight.outputs.source_sha }}
          path: src/guest-runtime
          token: ${{ steps.source-token.outputs.token }}
          persist-credentials: false

      - name: Check out pinned native cache tooling
        id: checkout-platform
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kuasar-sandbox/kuasar-sandbox
          ref: 90f2e9e2c6394908737ce3fc3d193e411069426d
          path: src/platform
          token: ${{ steps.source-token.outputs.token }}
          persist-credentials: false

      - name: Retry native cache tooling checkout
        if: steps.checkout-platform.outcome == 'failure'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kuasar-sandbox/kuasar-sandbox
          ref: 90f2e9e2c6394908737ce3fc3d193e411069426d
          path: src/platform
          token: ${{ steps.source-token.outputs.token }}
          persist-credentials: false

      - name: Revoke source token before code execution
        if: ${{ always() && steps.source-token.outputs.token != '' }}
        env:
          GH_TOKEN: ${{ steps.source-token.outputs.token }}
        run: |
          set -euo pipefail
          status=$(curl --show-error --silent \
            --retry 4 --retry-all-errors --connect-timeout 10 --max-time 60 \
            --request DELETE \
            --output /dev/null \
            --write-out '%{http_code}' \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/installation/token)
          case "$status" in
            204|401) ;;
            *) echo "failed to revoke source token: HTTP $status" >&2; exit 1 ;;
          esac

      - name: Attach source cache
        run: |
          set -euo pipefail
          install -d -m 0755 /var/cache/kuasar/tarballs
          mkdir -p src/guest-runtime/native-deps/build
          ln -sfn /var/cache/kuasar/tarballs src/guest-runtime/native-deps/build/tarball
          linux_file=$(awk '/^LINUX_TARBALL[[:space:]]*\?=/ { url=$3; sub(/\\#.*/, "", url); n=split(url, part, "/"); print part[n]; exit }' src/guest-runtime/native-deps/Makefile)
          [[ "$linux_file" =~ ^linux-([0-9]+)\..*\.tar\.gz$ ]]
          echo "LINUX_TARBALL=https://mirrors.tuna.tsinghua.edu.cn/kernel/v${BASH_REMATCH[1]}.x/$linux_file" >> "$GITHUB_ENV"

      - name: Restore or build guest kernel
        env:
          KUASAR_WORKSPACE_ROOT: ${{ github.workspace }}/src
        run: src/platform/ci/native-cache/native-cache.sh restore-or-build vmlinux

      - name: Validate native dependency scripts
        run: make -C src/guest-runtime/native-deps test

      - name: Package vmlinux release
        working-directory: src/guest-runtime
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          [ "$(git rev-parse HEAD)" = "${{ needs.preflight.outputs.source_sha }}" ]
          export SOURCE_DATE_EPOCH
          SOURCE_DATE_EPOCH=$(git show -s --format=%ct "${{ needs.preflight.outputs.source_sha }}")
          bash scripts/release.sh package vmlinux "$VERSION" "$TARGET_ARCH" \
            release-bundle

      - name: Upload validated vmlinux bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vmlinux-release-${{ needs.preflight.outputs.version }}-${{ github.run_id }}
          path: src/guest-runtime/release-bundle
          if-no-files-found: error
          retention-days: 1

  publish:
    needs:
      - preflight
      - build
    runs-on: [self-hosted, Linux, X64, kuasar-control]
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out trusted publish tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned GitHub CLI
        run: bash scripts/install-gh-cli.sh

      - name: Download validated vmlinux bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vmlinux-release-${{ needs.preflight.outputs.version }}-${{ github.run_id }}
          path: release-bundle

      - name: Publish vmlinux release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.preflight.outputs.version }}
          TARGET_ARCH: x86_64
          RELEASE_KIND: vmlinux
          SOURCE_REF: ${{ needs.preflight.outputs.source_ref }}
          SOURCE_SHA: ${{ needs.preflight.outputs.source_sha }}
          AGGREGATE_VERSION: ${{ inputs.aggregate_version }}
          AGGREGATE_SHA: ${{ inputs.aggregate_sha }}
        run: |
          set -euo pipefail
          bash scripts/validate-preview-line.sh \
            vmlinux "$VERSION" "$AGGREGATE_VERSION" "$AGGREGATE_SHA"
          bash scripts/publish-release.sh publish \
            "$VERSION" "$TARGET_ARCH" "$SOURCE_SHA" release-bundle "$SOURCE_REF"

  cleanup:
    needs: publish
    runs-on: [self-hosted, Linux, X64, kuasar-control]
    timeout-minutes: 15
    permissions:
      actions: write
      contents: read
    steps:
      - name: Check out trusted cleanup tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned GitHub CLI
        run: bash scripts/install-gh-cli.sh

      - name: Delete release workflow artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          artifact_id_lines=$(gh api --paginate \
            "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" \
            --jq '.artifacts[].id')
          artifact_ids=()
          if [[ -n "$artifact_id_lines" ]]; then
            mapfile -t artifact_ids <<< "$artifact_id_lines"
          fi
          for artifact_id in "${artifact_ids[@]}"; do
            [[ "$artifact_id" =~ ^[0-9]+$ ]]
            gh api --method DELETE \
              "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id" \
              --silent
          done
          echo "deleted ${#artifact_ids[@]} release workflow artifact(s)"
