name: Delete Preview
run-name: Delete ${{ inputs.version }} (${{ inputs.mode }})
'on':
  workflow_dispatch:
    inputs:
      unit:
        description: Guest runtime release unit
        required: true
        type: choice
        options:
          - runtime
          - vmlinux
      version:
        description: Preview tag selected by the platform controller
        required: true
        type: string
      source_sha:
        description: Exact commit the preview tag must reference
        required: true
        type: string
      mode:
        description: Incomplete-publication recovery or retention GC
        required: true
        type: choice
        options:
          - incomplete
          - gc
permissions:
  contents: read
concurrency:
  group: component-mutation-${{ github.repository }}-${{ inputs.version }}
  cancel-in-progress: false
jobs:
  delete:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Require trusted cleanup controller
        run: |
          set -euo pipefail
          [ "$GITHUB_REF" = refs/heads/main ] \
            || { echo "Preview cleanup must run from main" >&2; exit 1; }
      - name: Check out trusted cleanup tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check out pinned hosted bootstrap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: kuasar-sandbox/kuasar-sandbox
          ref: 17a3469a33b4859ec13bb8399b81b657495d120f
          path: trusted/platform
          sparse-checkout: |
            ci/hosted
            ci/native-cache
          persist-credentials: false
      - name: Bootstrap standard runner
        run: bash trusted/platform/ci/hosted/bootstrap.sh --profile release-control
      - name: Check environment GitHub CLI
        run: |
          gh --version
          gh_help="$(gh api --help)"
          [[ "$gh_help" == *--slurp* ]] || { echo "environment gh must support api --slurp" >&2; exit 1; }
      - name: Delete preview release, assets, and tag
        env:
          GH_TOKEN: ${{ github.token }}
          UNIT: ${{ inputs.unit }}
          VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          MODE: ${{ inputs.mode }}
        run: bash scripts/delete-preview.sh "$UNIT" "$VERSION" "$SOURCE_SHA" "$MODE"
    if: github.event.repository.visibility == 'public' && github.event.repository.full_name == github.repository
